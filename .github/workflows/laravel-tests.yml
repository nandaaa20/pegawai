name: Laravel tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  phpunit:
    runs-on: ubuntu-latest
    container:
      image: php:8.5-cli-bookworm
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: simpeg_test
          MYSQL_USER: simpeg
          MYSQL_PASSWORD: simpeg_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Prepare PHP 8.5, Composer, Node and Git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git unzip curl ca-certificates libxml2-dev libzip-dev nodejs npm
          docker-php-ext-install pdo_mysql zip
          curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
          EXPECTED=$(curl -fsSL https://composer.github.io/installer.sig)
          ACTUAL=$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")
          test "$EXPECTED" = "$ACTUAL"
          php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -v
          composer --version

      - uses: actions/checkout@v4

      - name: Install locked Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Build frontend assets
        run: |
          npm ci
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save --no-package-lock "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
          npm run build

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list > /dev/null
        env:
          APP_ENV: testing

      - name: PHP syntax validation
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Test SIMPEG against MySQL
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: mysql
          DB_PORT: 3306
          DB_DATABASE: simpeg_test
          DB_USERNAME: simpeg
          DB_PASSWORD: simpeg_test_password
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
