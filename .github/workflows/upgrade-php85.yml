name: One-time PHP 8.5 dependency modernization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-php85.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    container:
      image: php:8.5-cli-bookworm
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: simpeg_test
          MYSQL_USER: simpeg
          MYSQL_PASSWORD: simpeg_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install PHP extensions, Composer and Node
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git unzip curl ca-certificates libonig-dev libxml2-dev libzip-dev nodejs npm
          php -m | grep -i '^dom$'
          php -m | grep -i '^mbstring$'
          docker-php-ext-install pdo_mysql zip
          curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
          EXPECTED=$(curl -fsSL https://composer.github.io/installer.sig)
          ACTUAL=$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")
          test "$EXPECTED" = "$ACTUAL"
          php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -v
          composer --version

      - name: Set PHP 8.5 platform target
        run: composer config platform.php 8.5.12

      - name: Update Laravel and security-sensitive dependencies
        run: |
          composer require 'laravel/framework:^12.69' 'laravel/sanctum:^4.2' 'laravel/tinker:^2.10' 'guzzlehttp/guzzle:^7.15.2' 'barryvdh/laravel-dompdf:^3.1' --no-update --no-interaction
          composer require --dev 'laravel/breeze:^2.4' 'nunomaduro/collision:^8.6' 'phpunit/phpunit:^11.5' 'spatie/laravel-ignition:~2.12.0' --no-update --no-interaction
          composer update --with-all-dependencies --no-interaction --no-progress
          composer audit --locked
          composer check-platform-reqs

      - name: Build frontend assets
        run: |
          npm ci
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save --no-package-lock "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
          npm run build

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list > /dev/null
        env:
          APP_ENV: testing

      - name: Check PHP syntax and run application tests
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: mysql
          DB_PORT: 3306
          DB_DATABASE: simpeg_test
          DB_USERNAME: simpeg
          DB_PASSWORD: simpeg_test_password
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      - name: Save verified dependency upgrade on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.json composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Laravel dependencies for PHP 8.5 after audit and tests"
            git push origin HEAD:main
          fi

          php -m | grep -i '^mbstring
          curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
          EXPECTED=$(curl -fsSL https://composer.github.io/installer.sig)
          ACTUAL=$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")
